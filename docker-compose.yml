name: cmpc-libros

services:
  db:
    image: postgres:16-alpine
    container_name: cmpc-db
    environment:
      POSTGRES_USER: cmpc
      POSTGRES_PASSWORD: cmpc_libros
      POSTGRES_DB: cmpc_libros
    ports:
      - "5432:5432"
    volumes:
      - cmpc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmpc -d cmpc_libros"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: cmpc-api
    environment:
      DATABASE_URL: postgresql://cmpc:cmpc_libros@db:5432/cmpc_libros?schema=public
      JWT_SECRET: cmpc-libros-dev-secret-change-in-production
      JWT_EXPIRES_IN: 8h
      UPLOAD_DIR: /app/uploads
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      SEED_ON_START: "true"
    ports:
      - "3000:3000"
    volumes:
      - cmpc_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: cmpc-web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cmpc_pgdata:
  cmpc_uploads:
